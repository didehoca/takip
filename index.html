<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dide Hoca Personal Training</title>
<meta name="theme-color" content="#f3b3c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dide Hoca">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --bg:#fbf6f8; --card:#ffffff; --ink:#2f2a33; --mut:#8a8190; --line:#efe6ec;
  --pri:#e88aa6; --pri2:#fbe3ea; --acc:#7cc6fe;
  --kcal:#ff8fa3; --p:#7cc6fe; --k:#ffc861; --y:#b9a3ff; --su:#5fd0c2;
  --ok:#5cc58f; --warn:#f6b04d; --bad:#ef6b6b; --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#f7b7c8,#c9b8ff);color:#4a2340;padding:10px 16px 9px;text-align:center;box-shadow:0 2px 12px rgba(120,60,100,.12)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px}
.brand img{width:42px;height:42px;background:#fff;border-radius:50%;padding:5px;box-shadow:0 2px 8px rgba(90,40,70,.15);flex:none}
.brand span{font-size:clamp(15px,4.8vw,19px);font-weight:800;letter-spacing:.2px;white-space:nowrap}
header small{display:block;margin-top:3px;font-size:13px;font-weight:600;color:#6b4462}
main{max-width:760px;margin:0 auto;padding:14px 14px 96px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:150px;border:0;background:none;color:var(--mut);font-size:12px;padding:6px 2px;border-radius:12px;cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--pri);background:var(--pri2)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:0 2px 10px rgba(120,80,110,.06);border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:520px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
.rings{display:flex;align-items:center;gap:6px;justify-content:space-around;flex-wrap:wrap}
.ring{text-align:center;font-size:12px;color:var(--mut)}
.ring .v{font-weight:700;color:var(--ink);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--pri);color:#fff}
.btn.sec{background:var(--pri2);color:#b04f6e}
.btn.gh{background:#f3eef2;color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.blk{width:100%}
.btn:disabled{opacity:.5}
.x{border:0;background:#f6eef2;color:#b04f6e;border-radius:9px;width:28px;height:28px;cursor:pointer;font-size:14px}
input,select,textarea{width:100%;border:1px solid #e6dbe2;border-radius:12px;padding:10px 11px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px}
.f{margin-bottom:10px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.ok{background:#e3f6ec;color:#2f8a5c}.pill.warn{background:#fff1dc;color:#a8681a}.pill.bad{background:#fde4e4;color:#b23a3a}
.ent{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.ent:first-of-type{border-top:0}
.ent .n{flex:1;min-width:0}
.ent .n div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.og{border-radius:14px;padding:10px 12px;margin-bottom:10px}
.og h4{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.fav{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer;background:#fff}
.fav.on{border-color:var(--pri);background:var(--pri2)}
.fav .n{flex:1}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mut)}
.bar{height:8px;background:#f2eaef;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
.ex{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:#fff}
.ex .t{font-weight:700}
.ex.run{border-color:#c9ebe4;background:#f7fffd}
.run .coach{background:#e2f6f1}
.coach{background:#eef6ff;border-radius:10px;padding:6px 8px;font-size:13px;margin:6px 0}
.stu{background:#fff4ec;border-radius:10px;padding:6px 8px;font-size:13px;margin:6px 0}
.day h4{margin:12px 0 6px;font-size:14px;color:#9a5a75}
.z{display:flex;gap:3px}
.z button{flex:1 1 0;min-width:0;height:32px;padding:0;border-radius:9px;border:2px solid transparent;cursor:pointer;font-weight:700;color:#fff;font-size:12px}
.z button.on{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#2f2a33;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.toast.err{background:#c94a4a}
.load{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;background:linear-gradient(90deg,#f7b7c8,#c9b8ff,#f7b7c8);background-size:200% 100%;animation:ld 1s linear infinite}
@keyframes ld{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--mut);padding:18px 6px}
.warnli{padding:9px 0;border-top:1px dashed var(--line);cursor:pointer}
.warnli:first-child{border-top:0}
.link{word-break:break-all;font-size:12px;background:#f7f2f5;border-radius:10px;padding:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.push{background:linear-gradient(135deg,#fff4f8,#f3efff);border-color:#f0d6e2}
.push b{display:block;margin-bottom:2px}
.pi{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-top:1px dashed rgba(0,0,0,.08)}
.pi:first-of-type{border-top:0}
.pi .n{flex:1;min-width:0}
.pi .alt{font-size:12.5px;color:#6b5f73;margin-top:2px}
.pi .acts{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.yendi{background:#e3f6ec;color:#2f8a5c;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.howto{background:rgba(255,255,255,.7);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0 2px;white-space:pre-wrap}
.dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.dchips button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 0;font-size:12px;cursor:pointer;line-height:1.2}
.dchips button b{display:block;font-size:13px}
.dchips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.dchips button.today:not(.on){border-color:var(--pri);color:#b04f6e}
.mi{border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;background:#fff}
.mi .g5x{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;gap:5px;margin-top:5px}
.mi input{padding:8px 8px;font-size:14px}
.mi label{font-size:11px;margin:0 0 2px}
</style>
</head>
<body>
<header><div class="brand"><img src="logo.png" alt=""><span>Dide Hoca Personal Training</span></div><small id="sub"></small></header>
<main id="app"><div class="empty">Yükleniyor…</div></main>
<nav id="nav"></nav>
<div id="ld" class="load" style="display:none"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxGMEt14iQj3emunOssy-8UbOUJ8nr3xkw9y19AwwFhfbJvh7Y9fpJV0zKbddVjAVR7nA/exec';
const OS_APP = '5a5e1fa7-3a89-40ff-9521-5d84479132d7';
const TOKEN = (function(){
  let t = (new URLSearchParams(location.search).get('t') || '').trim();
  try { if(t) localStorage.setItem('dh_t', t); else t = localStorage.getItem('dh_t') || ''; } catch(e) {}
  return t;
})();
let ROLE = 'none';
const OGUNLER = ['Kahvaltı','Ara öğün 1','Öğle','Ara öğün 2','Antrenman öncesi','Antrenman sonrası','Akşam','Gece'];
const OG_RENK = {'Kahvaltı':'#fff4d6','Ara öğün 1':'#e8f7ee','Öğle':'#e6f2ff','Ara öğün 2':'#f3ecff','Akşam':'#ffe8ee','Gece':'#ece9f7','Su':'#e0f7f4','Antrenman öncesi':'#e3f6f1','Antrenman sonrası':'#fdeee2'};
const KOSU = ['Easy run','Interval','Tempo run','Long run','Recovery run','Fartlek','Yarış / Test'];
const GUN = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const AY = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const GK = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const S = { tab:null };
let busy = 0;

/* ---------- altyapı ---------- */
function call(action, params, quiet){
  busy++; document.getElementById('ld').style.display='block';
  const done = () => { busy--; if(busy<=0){ busy=0; document.getElementById('ld').style.display='none'; } };
  return fetch(API, {method: 'POST', body: JSON.stringify({t: TOKEN, a: action, p: params || {}})})
    .then(r => r.json())
    .then(j => { done(); if(!j.ok) throw new Error(j.error || 'Bir hata oluştu'); return j.data; })
    .catch(e => { done(); if(!quiet) toast((e && e.message && e.message !== 'Failed to fetch') ? e.message : 'Bağlantı hatası. İnternetini kontrol edip tekrar dene.', true); throw e; });
}
function toast(m, err){
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4500 : 2200);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function n(v){ const x = Number(String(v == null ? '' : v).replace(',', '.')); return isFinite(x) ? x : 0; }
function fx(v, d){ if(v == null || v === '') return '–'; const m = Math.pow(10, d || 0); return String(Math.round(v * m) / m).replace('.', ','); }
function val(id){ const e = document.getElementById(id); return e ? e.value : ''; }
function $(id){ return document.getElementById(id); }
function pd(ds){ const a = ds.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
function ds(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addD(s, k){ const d = pd(s); d.setDate(d.getDate() + k); return ds(d); }
function fmtD(s, wd){ if(!s) return '–'; const d = pd(s); return d.getDate() + ' ' + AY[d.getMonth()] + (wd ? ' ' + GK[(d.getDay()+6)%7] : ''); }
function todayS(){ return ds(new Date()); }
function defOgun(){ const h = new Date().getHours(); return h < 11 ? 'Kahvaltı' : h < 13 ? 'Ara öğün 1' : h < 16 ? 'Öğle' : h < 18 ? 'Ara öğün 2' : h < 22 ? 'Akşam' : 'Gece'; }
function isDone(r){ return String(r.yapilan_set || '') !== '' || String(r.yapilan_km || '') !== '' || String(r.yapilan_sure || '') !== ''; }
function normPace(s){ s = String(s || '').trim().replace(/[.,]/g, ':'); if(/^\d+$/.test(s)) s += ':00'; return s; }
function secs(s){ s = String(s || '').trim().replace(/[.,]/g, ':'); if(!s) return 0; const p = s.split(':').map(Number); if(p.some(x => isNaN(x))) return 0; return p.length === 1 ? p[0] * 60 : p.length === 2 ? p[0] * 60 + p[1] : p[0] * 3600 + p[1] * 60 + p[2]; }
function mmss(t){ t = Math.round(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function runPlan(r){ const a = []; if(r.hedef_km) a.push(fx(n(r.hedef_km), 2) + ' km'); if(r.hedef_pace) a.push('@ ' + esc(r.hedef_pace) + ' /km'); return a.join(' ') || 'hedef yazılmadı'; }
function runSum(p){
  const rs = p.rows.filter(r => r.tur === 'kosu'); if(!rs.length) return '';
  const d = rs.reduce((a, r) => a + n(r.yapilan_km), 0), t = rs.reduce((a, r) => a + n(r.hedef_km), 0);
  return '<div class="mut" style="margin-top:8px">🏃 Bu hafta koşu: <b>' + fx(d, 1) + ' km</b>' + (t ? ' / hedef ' + fx(t, 1) + ' km' : '') + '</div>';
}
function nTxt(r){ return r && r.notified === true ? ' · 🔔 öğrenciye bildirim gitti' : r && r.notified === 'nosub' ? ' · ⚠️ öğrenci bildirimleri henüz açmamış' : ''; }
function gunNo(ds){ return (pd(ds).getDay() + 6) % 7 + 1; }
function zCol(z){ z = n(z); if(!z) return '#d8d0d6'; const h = 120 - (z - 1) * (120 / 9); return 'hsl(' + h + ',62%,52%)'; }
function pctCls(p){ return p == null ? '' : p > 1.15 ? 'bad' : p >= 0.85 ? 'ok' : 'warn'; }

/* ---------- grafikler ---------- */
function ring(v, t, col, lab, unit, big){
  const r = big ? 56 : 32, sw = big ? 13 : 8, sz = (r + sw) * 2, C = 2 * Math.PI * r;
  const p = t ? v / t : 0, d = Math.min(p, 1) * C;
  const over = t && p > 1.1;
  const kalan = t ? Math.max(0, t - v) : null;
  return '<div class="ring"><svg width="' + sz + '" height="' + sz + '" viewBox="0 0 ' + sz + ' ' + sz + '">' +
    '<circle cx="' + sz/2 + '" cy="' + sz/2 + '" r="' + r + '" fill="none" stroke="#f1e8ee" stroke-width="' + sw + '"/>' +
    '<circle cx="' + sz/2 + '" cy="' + sz/2 + '" r="' + r + '" fill="none" stroke="' + (over ? 'var(--bad)' : col) + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + d + ' ' + C + '" transform="rotate(-90 ' + sz/2 + ' ' + sz/2 + ')"/>' +
    '<text x="50%" y="' + (big ? '46%' : '50%') + '" text-anchor="middle" dominant-baseline="middle" font-size="' + (big ? 24 : 13) + '" font-weight="700" fill="#2f2a33">' + (t ? Math.round(p * 100) + '%' : fx(v)) + '</text>' +
    (big ? '<text x="50%" y="62%" text-anchor="middle" font-size="12" fill="#8a8190">' + (t ? (kalan > 0 ? fx(kalan) + ' kaldı' : 'tamam') : unit) + '</text>' : '') +
    '</svg><div>' + lab + '</div><div class="v">' + fx(v, unit === 'g' ? 0 : 0) + (t ? ' / ' + fx(t) : '') + ' ' + unit + '</div></div>';
}
function rings(tot, tg){
  return '<div class="rings">' + ring(tot.kcal, tg.kcal, 'var(--kcal)', 'Kalori', 'kcal', true) +
    '<div class="rings" style="flex:1;min-width:230px">' +
    ring(tot.p, tg.p, 'var(--p)', 'Protein', 'g') + ring(tot.k, tg.k, 'var(--k)', 'Karb', 'g') +
    ring(tot.y, tg.y, 'var(--y)', 'Yağ', 'g') + ring(tot.su, tg.su, 'var(--su)', 'Su', 'ml') + '</div></div>';
}
function weekBars(week, target, key, col){
  key = key || 'kcal'; col = col || 'var(--kcal)';
  const W = 320, H = 120, pad = 18, bw = (W - pad) / 7;
  const mx = Math.max(target || 0, ...week.map(d => d[key])) * 1.1 || 1;
  let s = '<svg viewBox="0 0 ' + W + ' ' + (H + 30) + '" width="100%">';
  if(target){ const y = H - target / mx * H; s += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#c9b8ff" stroke-dasharray="4 4"/><text x="' + W + '" y="' + (y - 4) + '" text-anchor="end" font-size="10" fill="#8a7cc0">hedef ' + Math.round(target) + '</text>'; }
  week.forEach((d, i) => {
    const h = d[key] / mx * H, x = pad / 2 + i * bw + bw * 0.18;
    const c = target && d[key] > target * 1.15 ? 'var(--bad)' : col;
    s += '<rect x="' + x + '" y="' + (H - h) + '" width="' + bw * 0.64 + '" height="' + Math.max(h, 0) + '" rx="6" fill="' + c + '" opacity="' + (d[key] ? 1 : .25) + '"/>';
    if(d[key]) s += '<text x="' + (x + bw * 0.32) + '" y="' + (H - h - 4) + '" text-anchor="middle" font-size="10" fill="#6a6170">' + Math.round(d[key]) + '</text>';
    s += '<text x="' + (x + bw * 0.32) + '" y="' + (H + 16) + '" text-anchor="middle" font-size="10" fill="#8a8190">' + GK[(pd(d.tarih).getDay()+6)%7] + '</text>';
    s += '<text x="' + (x + bw * 0.32) + '" y="' + (H + 28) + '" text-anchor="middle" font-size="9" fill="#b0a7b5">' + pd(d.tarih).getDate() + '</text>';
  });
  return s + '</svg>';
}
function lineChart(pts, goal, unit, col){
  if(pts.length < 1) return '<div class="empty">Henüz veri yok</div>';
  const W = 340, H = 150, L = 34, R = 10, T = 12, B = 26;
  const ys = pts.map(p => p.y).concat(goal != null ? [goal] : []);
  let mn = Math.min(...ys), mx = Math.max(...ys); if(mx - mn < 2){ mn -= 1; mx += 1; }
  const pr = (mx - mn) * 0.12; mn -= pr; mx += pr;
  const X = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const Y = v => T + (mx - v) / (mx - mn) * (H - T - B);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">';
  [mx - pr, (mx + mn) / 2, mn + pr].forEach(v => { s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#f1e8ee"/><text x="' + (L - 4) + '" y="' + (Y(v) + 3) + '" text-anchor="end" font-size="10" fill="#8a8190">' + fx(v, 1) + '</text>'; });
  if(goal != null) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(goal) + '" y2="' + Y(goal) + '" stroke="var(--ok)" stroke-dasharray="5 4"/><text x="' + (W - R) + '" y="' + (Y(goal) - 4) + '" text-anchor="end" font-size="10" fill="#2f8a5c">hedef ' + fx(goal, 1) + '</text>';
  s += '<polyline fill="none" stroke="' + (col || 'var(--pri)') + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="' + pts.map((p, i) => X(i) + ',' + Y(p.y)).join(' ') + '"/>';
  pts.forEach((p, i) => {
    s += '<circle cx="' + X(i) + '" cy="' + Y(p.y) + '" r="4" fill="#fff" stroke="' + (col || 'var(--pri)') + '" stroke-width="2.5"/>';
    if(pts.length <= 8 || i === 0 || i === pts.length - 1 || i % Math.ceil(pts.length / 6) === 0)
      s += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9.5" fill="#8a8190">' + fmtD(p.x) + '</text>';
  });
  return s + '</svg>';
}

/* ---------- ortak görünümler ---------- */
function dateNav(d, fn){
  const isT = d === todayS();
  return '<div class="row" style="margin-bottom:10px"><button class="btn gh sm" onclick="' + fn + '(\'' + addD(d, -1) + '\')">‹</button>' +
    '<div class="sp" style="text-align:center;font-weight:700">' + (isT ? 'Bugün · ' : '') + fmtD(d, true) + '</div>' +
    (isT ? '' : '<button class="btn sec sm" onclick="' + fn + '(\'' + todayS() + '\')">Bugün</button>') +
    '<button class="btn gh sm" onclick="' + fn + '(\'' + addD(d, 1) + '\')">›</button>' +
    '<input type="date" value="' + d + '" style="width:42px;padding:6px;color:transparent;cursor:pointer" onchange="' + fn + '(this.value)"></div>';
}
function entriesView(day, readonly){

function eat(mid, iid, alt){
  if(S.day.loading) return;
  const {m, i} = planItem(mid, iid); if(!i || eatenOf(iid)) return;
  const e = {ogun: m.ogun, besin: alt ? i.alternatif : i.besin, miktar: alt ? '' : i.miktar, kcal: i.kcal, p: i.p, k: i.k, y: i.y, plan_id: i.id};
  addLocal(e); toast('✓ ' + e.besin + ' günlüğüne işlendi'); render_plan();
  sync('addEntry', Object.assign({date: S.date}, e), r => { applyDay(r); if(S.tab === 'plan' && idle()) render_plan(); });
}
function eatMeal(mid){
  if(S.day.loading) return;
  const m = S.plan.meals.find(x => x.id === mid); if(!m) return;
  const items = m.items.filter(i => !eatenOf(i.id)).map(i => ({ogun: m.ogun, besin: i.besin, miktar: i.miktar, kcal: i.kcal, p: i.p, k: i.k, y: i.y, plan_id: i.id}));
  if(!items.length) return;
  items.forEach(e => addLocal(e)); toast('✓ ' + m.ogun + ' günlüğüne işlendi'); render_plan();
  sync('addEntries', {date: S.date, items}, r => { applyDay(r); if(S.tab === 'plan' && idle()) render_plan(); });
}
function uneat(iid){
  const e = eatenOf(iid); if(!e) return;
  if(String(e.id).indexOf('tmp') === 0){ toast('Kaydediliyor, birkaç saniye sonra geri alabilirsin'); return; }
  S.day.entries = S.day.entries.filter(x => x.id !== e.id); recalc(S.day); render_plan();
  sync('deleteEntry', {id: e.id, date: S.date}, r => { if(r.date === S.date) S.day = r; if(S.tab === 'plan' && idle()) render_plan(); });
}

const C_VIEWS = {
  ozet: () => { if(S.ov) render_ozet(); if(S.ovTs && Date.now() - S.ovTs < 20000) return; S.ovTs = Date.now(); call('overview', {}, true).then(r => { S.ov = r; S.ovTs = Date.now(); cacheSet(r); if(S.tab === 'ozet' && idle()) render_ozet(); }).catch(() => {}); },
  ogrenci: () => { if(!S.sid && S.ov && S.ov.students.length) S.sid = S.ov.students[0].id; if(S.det) render_det(); if(S.sid) loadDet(S.sid); else $('app').innerHTML = '<div class="empty">Öğrenci yok</div>'; },
  program: () => { if(!S.sid && S.ov && S.ov.students.length) S.sid = S.ov.students[0].id; if(S.cprog) render_cprog(); if(S.sid) loadCProg(S.cprog ? S.cprog.week : todayS()); },
  ayarlar: () => { call('settings').then(r => { S.set = r; render_ayar(); }); },
  beslenme: () => {
    if(!S.sid && S.ov && S.ov.students.length) S.sid = S.ov.students[0].id;
    if(!S.cfavs) call('favs', {}, true).then(f => { S.cfavs = f; if(S.tab === 'beslenme' && idle()) render_np(); }).catch(() => {});
    if(S.np && S.np.sid === S.sid) render_np(); else wait_();
    if(S.sid && !S.npDirty) loadNp(S.sid);
  }
};

function studentSel(fn){

function pb(v, t, col){ const p = t ? Math.min(v / t, 1.3) : 0; return '<div class="bar"><i style="width:' + Math.min(p, 1) * 100 + '%;background:' + (p > 1.15 ? 'var(--bad)' : col) + '"></i></div>'; }

  h += '<div class="card"><h3>⚠️ Dikkat gerekenler</h3>' + (uy.length ? uy.map(s => '<div class="warnli" onclick="openStu(\'' + s.id + '\')"><div class="row"><b class="sp">' + esc(s.ad) + '</b><span class="pill ' + (s.level === 2 ? 'bad' : 'warn') + '">' + (s.level === 2 ? 'Acil' : 'Dikkat') + '</span></div><div class="mut">' + s.warn.map(esc).join(' · ') + '</div></div>').join('') : '<div class="empty">Her şey yolunda 🎉</div>') + '</div>';
  h += '<div class="card"><h3>Bugün herkes · ' + fmtD(o.today, true) + '</h3>' + act.map(s => {
    const t = s.targets;
    return '<div class="warnli" onclick="openStu(\'' + s.id + '\')"><div class="row" style="margin-bottom:6px"><b class="sp">' + esc(s.ad) + '</b><span class="mut">' + (s.lastDays == null ? 'hiç giriş yok' : s.lastDays === 0 ? 'bugün girdi' : s.lastDays + ' gün önce') + '</span></div>' +
      '<div class="grid g4" style="gap:8px;font-size:12px">' +
      '<div>Kalori <b>' + fx(s.today.kcal) + '</b>' + (t.kcal ? '/' + t.kcal : '') + pb(s.today.kcal, t.kcal, 'var(--kcal)') + '</div>' +
      '<div>Protein <b>' + fx(s.today.p) + '</b>' + (t.p ? '/' + t.p : '') + pb(s.today.p, t.p, 'var(--p)') + '</div>' +
      '<div>Karb <b>' + fx(s.today.k) + '</b>' + (t.k ? '/' + t.k : '') + pb(s.today.k, t.k, 'var(--k)') + '</div>' +
      '<div>Su <b>' + fx(s.today.su) + '</b>' + (t.su ? '/' + t.su : '') + pb(s.today.su, t.su, 'var(--su)') + '</div></div>' +
      '<div class="mut" style="margin-top:6px">7 gün ort.: ' + (s.avg ? s.avg.kcal + ' kcal · P ' + s.avg.p + ' g (' + s.nd + ' gün)' : '–') +
      ' · Kilo: ' + fx(s.cur, 1) + (s.change != null ? ' (' + (s.change > 0 ? '+' : '') + fx(s.change, 1) + ')' : '') +
      ' · Antrenman: ' + (s.prTotal ? s.prDone + '/' + s.prTotal : 'program yok') + (s.planTotal ? ' · Plan: ' + s.planDone + '/' + s.planTotal : '') + '</div></div>';
  }).join('') + '</div>';
  $('app').innerHTML = h;
}
function openStu(id){ S.sid = id; S.det = null; S.cdate = todayS(); go('ogrenci'); }
function loadDet(id, d){

function cDay(d){ S.cdate = d; call('day', {sid: S.sid, date: d}).then(r => { S.det.day = r; render_det(); }); }
function render_det(){
  const s = S.det, d = s.day, t = s.targets;
  if(s.id !== S.sid) return;
  const avgDays = d.week.filter(x => x.kcal > 0);
  const avg = k => avgDays.length ? Math.round(avgDays.reduce((a, x) => a + x[k], 0) / avgDays.length) : null;
  let h = studentSel('loadDet') +
    (s.aktif ? '' : '<div class="card" style="background:#fdeaea">Bu öğrenci pasif. Linki çalışmıyor.</div>') +
    '<div class="tabs">' + [['gun','Beslenme'],['olcum','Ölçümler'],['hedef','Hedefler & link']].map(x => '<button class="' + ((S.dt || 'gun') === x[0] ? 'on' : '') + '" onclick="S.dt=\'' + x[0] + '\';render_det()">' + x[1] + '</button>').join('') + '</div>';
  if((S.dt || 'gun') === 'gun'){
    h += dateNav(d.date, 'cDay') + '<div class="card">' + rings(d.totals, t) + '</div>' +
      '<div class="card"><h3>Yedikleri</h3>' + entriesView(d, true) + '</div>' +
      '<div class="card"><h3>7 gün · kalori</h3>' + weekBars(d.week, t.kcal) + '</div>' +
      '<div class="card"><h3>7 gün tablosu</h3><div class="tw"><table><tr><th>Gün</th><th>kcal</th><th>P</th><th>K</th><th>Y</th><th>Su</th></tr>' +
      d.week.slice().reverse().map(x => { const pc = t.kcal && x.kcal ? x.kcal / t.kcal : null; return '<tr><td>' + fmtD(x.tarih, true) + '</td><td>' + (x.kcal ? '<span class="pill ' + pctCls(pc) + '">' + Math.round(x.kcal) + '</span>' : '–') + '</td><td>' + (x.p ? Math.round(x.p) : '–') + '</td><td>' + (x.k ? Math.round(x.k) : '–') + '</td><td>' + (x.y ? Math.round(x.y) : '–') + '</td><td>' + (x.su || '–') + '</td></tr>'; }).join('') +
      '<tr><th>Ort.</th><th>' + (avg('kcal') ?? '–') + '</th><th>' + (avg('p') ?? '–') + '</th><th>' + (avg('k') ?? '–') + '</th><th>' + (avg('y') ?? '–') + '</th><th>' + (avg('su') ?? '–') + '</th></tr>' +
      '<tr><td class="mut">Hedef</td><td class="mut">' + (t.kcal || '–') + '</td><td class="mut">' + (t.p || '–') + '</td><td class="mut">' + (t.k || '–') + '</td><td class="mut">' + (t.y || '–') + '</td><td class="mut">' + (t.su || '–') + '</td></tr></table></div><div class="mut">Ortalama sadece giriş yapılan günlerden hesaplanır.</div></div>';
  } else if(S.dt === 'olcum'){
    h += '<div class="card"><h3>Özet</h3>' + measCards(s.meas) + '</div>' + measCharts(s.meas) + '<div class="card"><h3>Tüm ölçümler</h3>' + measTable(s.meas, false) + '</div>';
  } else {
    const mk = n(t.p) * 4 + n(t.k) * 4 + n(t.y) * 9;
    h += '<div class="card"><h3>Günlük hedefler</h3><div class="grid g3">' +
      [['kcal','Kalori (kcal)'],['p','Protein (g)'],['k','Karbonhidrat (g)'],['y','Yağ (g)'],['su','Su (ml)']].map(x => '<div class="f"><label>' + x[1] + '</label><input id="t_' + x[0] + '" inputmode="decimal" value="' + (t[x[0]] || '') + '" oninput="macroChk()"></div>').join('') +
      '</div><div class="mut" id="mchk" style="margin-bottom:10px">' + (mk ? 'Makrolardan hesaplanan: ' + Math.round(mk) + ' kcal' : '') + '</div>' +
      '<div class="grid g2"><div class="f"><label>Amaç</label><select id="t_amac">' + ['Kilo ver','Kilo al','Kilo koru'].map(a => '<option' + (a === s.amac ? ' selected' : '') + '>' + a + '</option>').join('') + '</select></div><div class="f"><label>Hedef kilo</label><input id="t_hk" inputmode="decimal" value="' + esc(s.hedefKilo) + '"></div></div>' +
      '<button class="btn blk" onclick="saveTg()">Hedefleri kaydet</button></div>' +
      '<div class="card"><h3>Öğrencinin linki</h3><div class="mut" style="margin-bottom:6px">Bu linki sadece bu öğrenciye gönder. Kendi sayfasına giriş anahtarıdır.</div><div class="link" id="slink">' + esc(s.link) + '</div>' +
      '<div class="row" style="margin-top:8px"><button class="btn sec sm" onclick="cp(\'slink\')">Kopyala</button><a class="btn gh sm" style="text-decoration:none" target="_blank" href="https://wa.me/?text=' + encodeURIComponent('Merhaba! Beslenme ve antrenman takip sayfan: ' + s.link) + '">WhatsApp ile gönder</a><span class="sp"></span>' +
      '<button class="btn gh sm" onclick="setAct(' + (!s.aktif) + ')">' + (s.aktif ? 'Pasif yap' : 'Aktif yap') + '</button></div></div>';
  }
  $('app').innerHTML = h;
}
function macroChk(){ const mk = n(val('t_p')) * 4 + n(val('t_k')) * 4 + n(val('t_y')) * 9, kc = n(val('t_kcal')); $('mchk').innerHTML = mk ? 'Makrolardan hesaplanan: <b>' + Math.round(mk) + ' kcal</b>' + (kc ? ' (girilen ' + kc + ', fark ' + Math.round(mk - kc) + ')' : '') : ''; }
function saveTg(){
  call('saveTargets', {sid: S.sid, kcal: val('t_kcal'), p: val('t_p'), k: val('t_k'), y: val('t_y'), su: val('t_su'), amac: val('t_amac'), hedefKilo: val('t_hk')})
    .then(r => { S.det = r; toast('✓ Hedefler kaydedildi' + nTxt(r)); render_det(); call('overview').then(o => S.ov = o); });
}
function setAct(a){ call('setActive', {sid: S.sid, aktif: a}).then(r => { S.det = r; render_det(); call('overview').then(o => S.ov = o); }); }
function cp(id){
  const t = $(id).textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('✓ Kopyalandı')).catch(() => {
    const r = document.createRange(); r.selectNode($(id)); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Seçildi, kopyala');
  });
}
function loadCProg(w, sid){
  if(sid) S.sid = sid;
  call('program', {sid: S.sid, week: w}).then(r => { S.cprog = r; S.cprog.sid = S.sid; S.edit = r.rows.map(x => Object.assign({}, x)); S.dirty = false; if(S.tab === 'program') render_cprog(); });
}
function render_cprog(){
  const p = S.cprog;
  if(p.sid !== S.sid) return;

  if(!S.edit.length) h += '<div class="card"><div class="empty">Bu hafta için program yok.</div><button class="btn sec blk" onclick="copyPrev()">↺ Geçen haftanın programını kopyala</button></div>';
  for(let g = 1; g <= 7; g++){
    const idx = S.edit.map((r, i) => r.gun === g ? i : -1).filter(i => i >= 0);
    h += '<div class="card day"><div class="row"><h3 class="sp" style="margin:0">' + GUN[g - 1] + ' <span class="mut">' + fmtD(addD(p.week, g - 1)) + '</span></h3><div class="row" style="gap:6px"><button class="btn sec sm" onclick="addEx(' + g + ')">＋ Hareket</button><button class="btn sm" style="background:#d9f3ee;color:#1f7a6a" onclick="addEx(' + g + ',\'kosu\')">＋ Koşu</button></div></div>' +
      idx.map(i => { const r = S.edit[i]; if(r.tur === 'kosu') return runEd(r, i); return '<div class="ex" style="margin-top:8px"><div class="row"><input class="sp" style="width:auto" placeholder="Egzersiz (ör. Squat)" value="' + esc(r.egzersiz) + '" oninput="ed(' + i + ',\'egzersiz\',this.value)"><button class="x" onclick="rmEx(' + i + ')">✕</button></div>' +
        '<div class="grid g3" style="margin-top:6px"><div><label>Set</label><input inputmode="numeric" value="' + esc(r.set) + '" oninput="ed(' + i + ',\'set\',this.value)"></div><div><label>Tekrar</label><input value="' + esc(r.tekrar) + '" placeholder="10-12" oninput="ed(' + i + ',\'tekrar\',this.value)"></div><div><label>Sıra</label><div class="row" style="gap:4px"><button class="btn gh sm" onclick="mv(' + i + ',-1)">↑</button><button class="btn gh sm" onclick="mv(' + i + ',1)">↓</button></div></div></div>' +
        '<div style="margin-top:6px"><input placeholder="Not (ör. tempo 3-1-1, 90 sn dinlenme)" value="' + esc(r.antrenor_notu) + '" oninput="ed(' + i + ',\'antrenor_notu\',this.value)"></div>' +
        (r.yapilan_set !== undefined && (r.yapilan_set || r.agirlik || r.zorluk || r.ogrenci_notu) ? '<div class="stu">🏋️ Öğrenci: ' + esc(r.yapilan_set || '–') + ' set · ' + esc(r.yapilan_tekrar || '–') + ' tekrar · ' + esc(r.agirlik || '–') + (r.zorluk ? ' · <span class="pill" style="background:' + zCol(r.zorluk) + ';color:#fff">Zorluk ' + esc(r.zorluk) + '</span>' : '') + (r.ogrenci_notu ? '<br>💬 ' + esc(r.ogrenci_notu) : '') + '</div>' : '') +
        '</div>'; }).join('') + '</div>';
  }
  h += '<div style="position:sticky;bottom:72px;z-index:4;margin-bottom:12px"><button class="btn blk" style="box-shadow:0 6px 18px rgba(232,138,166,.45)" onclick="saveProg()">' + (S.dirty ? '💾 Programı kaydet (değişiklik var)' : '💾 Programı kaydet') + '</button></div>';
  h += '<div class="card"><h3>📋 Haftalık notun (öğrenci görür)</h3><textarea id="cnote" placeholder="Bu haftanın odağı, beslenme hatırlatmaları…">' + esc(p.antrenorNotu) + '</textarea><button class="btn sec blk" style="margin-top:8px" onclick="call(\'saveCoachNote\',{sid:S.sid,week:S.cprog.week,text:val(\'cnote\')}).then(r=>{S.cprog.antrenorNotu=r.antrenorNotu;toast(\'✓ Not kaydedildi\'+nTxt(r))})">Notu kaydet</button></div>';
  h += '<div class="card" style="background:#fff8f1"><h3>💬 Öğrencinin haftalık notu</h3>' + (p.ogrenciNotu ? esc(p.ogrenciNotu).replace(/\n/g, '<br>') : '<span class="mut">Henüz not yok</span>') +
    '<div class="mut" style="margin-top:8px">Tamamlanan: ' + p.done + '/' + p.total + (p.avgZorluk ? ' · Ort. zorluk ' + fx(p.avgZorluk, 1) : '') + '</div>' + runSum(p) + '</div>';
  $('app').innerHTML = h;
}
function guardDirty(){ return !S.dirty || confirmLike(); }
function confirmLike(){ if(S._dc){ S._dc = false; return true; } S._dc = true; toast('Kaydedilmemiş değişiklik var. Yine de geçmek için tekrar dokun.', true); setTimeout(() => S._dc = false, 4000); return false; }
function chgProgStu(id){ if(!guardDirty()){ render_cprog(); return; } loadCProg(S.cprog.week, id); }
function chgProgWeek(w){ if(!guardDirty()) return; loadCProg(w); }
function ed(i, k, v){ S.edit[i][k] = v; if(!S.dirty){ S.dirty = true; const b = document.querySelector('#app .btn.blk[onclick="saveProg()"]'); if(b) b.textContent = '💾 Programı kaydet (değişiklik var)'; } }
function addEx(g, tur){ S.edit.push({gun: g, tur: tur === 'kosu' ? 'kosu' : 'kuvvet', egzersiz: '', set: '', tekrar: '', antrenor_notu: '', kosu_tipi: tur === 'kosu' ? 'Easy run' : '', hedef_km: '', hedef_pace: ''}); S.dirty = true; render_cprog(); }
function runEd(r, i){
  const tip = r.kosu_tipi || 'Easy run', opts = KOSU.indexOf(tip) < 0 ? KOSU.concat([tip]) : KOSU;
  return '<div class="ex run" style="margin-top:8px"><div class="row"><span style="font-size:18px">🏃</span><select class="sp" style="width:auto;font-weight:600" onchange="ed(' + i + ',\'kosu_tipi\',this.value)">' +
    opts.map(k => '<option' + (k === tip ? ' selected' : '') + '>' + esc(k) + '</option>').join('') + '</select><button class="x" onclick="rmEx(' + i + ')">✕</button></div>' +
    '<div class="grid g3" style="margin-top:6px"><div><label>Hedef km</label><input inputmode="decimal" placeholder="5" value="' + esc(r.hedef_km) + '" oninput="ed(' + i + ',\'hedef_km\',this.value)"></div><div><label>Hedef pace /km</label><input placeholder="6:30" value="' + esc(r.hedef_pace) + '" oninput="ed(' + i + ',\'hedef_pace\',this.value)"></div><div><label>Sıra</label><div class="row" style="gap:4px"><button class="btn gh sm" onclick="mv(' + i + ',-1)">↑</button><button class="btn gh sm" onclick="mv(' + i + ',1)">↓</button></div></div></div>' +
    '<div style="margin-top:6px"><input placeholder="Not (ör. 6×400 m, aralarda 90 sn yürüyüş)" value="' + esc(r.antrenor_notu) + '" oninput="ed(' + i + ',\'antrenor_notu\',this.value)"></div>' +
    (r.yapilan_km || r.yapilan_sure || r.yapilan_pace || r.zorluk || r.ogrenci_notu ? '<div class="stu">🏃 Öğrenci: ' + (r.yapilan_km ? fx(n(r.yapilan_km), 2) + ' km' : '– km') + ' · ' + esc(r.yapilan_sure || '–') + ' · ' + esc(r.yapilan_pace || '–') + ' /km' +
      (r.zorluk ? ' · <span class="pill" style="background:' + zCol(r.zorluk) + ';color:#fff">Zorluk ' + esc(r.zorluk) + '</span>' : '') + (r.ogrenci_notu ? '<br>💬 ' + esc(r.ogrenci_notu) : '') + '</div>' : '') + '</div>';
}
function rmEx(i){ S.edit.splice(i, 1); S.dirty = true; render_cprog(); }
function mv(i, d){
  const g = S.edit[i].gun, idx = S.edit.map((r, j) => r.gun === g ? j : -1).filter(j => j >= 0), pos = idx.indexOf(i), to = idx[pos + d];
  if(to === undefined) return; const t = S.edit[i]; S.edit[i] = S.edit[to]; S.edit[to] = t; S.dirty = true; render_cprog();
}
function saveProg(){
  call('saveProgram', {sid: S.sid, week: S.cprog.week, rows: S.edit.map(r => ({id: r.id || '', gun: r.gun, egzersiz: r.tur === 'kosu' ? (r.kosu_tipi || 'Easy run') : r.egzersiz, set: r.set, tekrar: r.tekrar, antrenor_notu: r.antrenor_notu, tur: r.tur || 'kuvvet', kosu_tipi: r.tur === 'kosu' ? (r.kosu_tipi || 'Easy run') : '', hedef_km: r.hedef_km || '', hedef_pace: normPace(r.hedef_pace)}))})
    .then(r => { S.cprog = r; S.cprog.sid = S.sid; S.edit = r.rows.map(x => Object.assign({}, x)); S.dirty = false; toast('✓ Program kaydedildi' + nTxt(r)); render_cprog(); });
}
function copyPrev(){ call('copyProgram', {sid: S.sid, week: S.cprog.week}).then(r => { S.cprog = r; S.cprog.sid = S.sid; S.edit = r.rows.map(x => Object.assign({}, x)); S.dirty = false; toast('✓ Geçen hafta kopyalandı' + nTxt(r)); render_cprog(); }); }
/* --- Antrenör: beslenme planı --- */
function loadNp(sid){
  S.sid = sid;
  call('nutrition', {sid}).then(r => {
    if(sid !== S.sid) return;
    S.np = r; S.np.sid = sid; S.npEdit = JSON.parse(JSON.stringify(r.meals)); S.npDirty = false;
    if(!S.npDay) S.npDay = r.today;
    if(S.tab === 'beslenme') render_np();
  }).catch(() => {});
}
function chgNpStu(id){ if(S.npDirty && !confirmLike()){ render_np(); return; } S.npDirty = false; S.np = null; wait_(); loadNp(id); }
function npDirty(){ if(!S.npDirty){ S.npDirty = true; const b = $('npSave'); if(b) b.textContent = '💾 Beslenme planını kaydet (değişiklik var)'; } }
function npSum(g){ const t = {kcal: 0, p: 0, k: 0, y: 0}; S.npEdit.filter(m => m.gun === g).forEach(m => m.items.forEach(i => { t.kcal += n(i.kcal); t.p += n(i.p); t.k += n(i.k); t.y += n(i.y); })); return t; }
function npTot(){
  const t = npSum(S.npDay), tg = S.np.targets || {};
  const cell = (v, tv, u, lab) => { const p = tv ? v / tv : null; return '<div class="stat" style="padding:8px"><b style="font-size:16px">' + Math.round(v) + (tv ? '<span class="mut" style="font-size:12px;font-weight:500"> / ' + tv + '</span>' : '') + '</b><span>' + lab + (p != null ? ' <i class="pill ' + pctCls(p) + '" style="font-style:normal">%' + Math.round(p * 100) + '</i>' : '') + '</span></div>'; };
  return '<div class="grid g4" style="gap:6px">' + cell(t.kcal, tg.kcal, '', 'kcal') + cell(t.p, tg.p, 'g', 'Protein') + cell(t.k, tg.k, 'g', 'Karb') + cell(t.y, tg.y, 'g', 'Yağ') + '</div>';
}
function render_np(){
  if(!S.np || S.np.sid !== S.sid){ wait_(); return; }
  const g = S.npDay, ms = S.npEdit.map((m, i) => [m, i]).filter(x => x[0].gun === g);
  let h = studentSel('chgNpStu');
  h += '<div class="dchips">' + GK.map((k, i) => { const c = S.npEdit.filter(m => m.gun === i + 1).length; return '<button class="' + (g === i + 1 ? 'on ' : '') + (S.np.today === i + 1 ? 'today' : '') + '" onclick="S.npDay=' + (i + 1) + ';render_np()"><b>' + k + '</b>' + (c ? c + ' öğün' : '–') + '</button>'; }).join('') + '</div>';
  h += '<div class="card"><div class="row" style="margin-bottom:8px"><h3 class="sp" style="margin:0">' + GUN[g - 1] + ' · plan toplamı</h3></div>' + npTot() + (S.np.targets && S.np.targets.kcal ? '' : '<div class="mut" style="margin-top:6px">Bu öğrencinin hedefleri girilmemiş (Öğrenci → Hedefler).</div>') + '</div>';
  if(!ms.length) h += '<div class="card empty">' + GUN[g - 1] + ' için henüz öğün yok.<br>Aşağıdan öğün ekle ya da başka bir günü buraya kopyala.</div>';
  ms.forEach(([m, mi]) => {
    const opts = OGUNLER.indexOf(m.ogun) < 0 && m.ogun ? OGUNLER.concat([m.ogun]) : OGUNLER;
    h += '<div class="og" style="background:' + (OG_RENK[m.ogun] || '#f6f2f4') + '"><div class="row" style="gap:5px;flex-wrap:nowrap"><select style="width:auto;flex:1;min-width:0;font-weight:700" onchange="npSet(' + mi + ',\'ogun\',this.value,1)">' + opts.map(o => '<option' + (o === m.ogun ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' +
      '<input type="time" style="width:92px;padding:8px 6px" value="' + esc(m.saat) + '" onchange="npSet(' + mi + ',\'saat\',this.value)">' +
      '<button class="x" style="background:#fff;color:var(--ink)" title="Yukarı" onclick="npMove(' + mi + ',-1)">↑</button><button class="x" style="background:#fff;color:var(--ink)" title="Aşağı" onclick="npMove(' + mi + ',1)">↓</button><button class="x" onclick="npDel(' + mi + ')">✕</button></div>' +
      m.items.map((it, ii) => '<div class="mi"><div class="row" style="gap:6px"><input class="sp" style="width:auto" list="favlist" placeholder="Besin (ör. Yumurta)" value="' + esc(it.besin) + '" oninput="npItem(' + mi + ',' + ii + ',\'besin\',this.value)" onchange="npFav(' + mi + ',' + ii + ',this.value)"><button class="x" onclick="npItemDel(' + mi + ',' + ii + ')">✕</button></div>' +
        '<div class="g5x">' + [['miktar','Miktar','ör. 2 adet'],['kcal','kcal',''],['p','P (g)',''],['k','K (g)',''],['y','Y (g)','']].map(f => '<div><label>' + f[1] + '</label><input id="np_' + mi + '_' + ii + '_' + f[0] + '"' + (f[0] === 'miktar' ? '' : ' inputmode="decimal"') + ' placeholder="' + f[2] + '" value="' + esc(it[f[0]] === 0 ? '' : it[f[0]]) + '" oninput="npItem(' + mi + ',' + ii + ',\'' + f[0] + '\',this.value)"></div>').join('') + '</div>' +
        '<input style="margin-top:5px" placeholder="Alternatif (ör. 1 kase lor peyniri)" value="' + esc(it.alternatif) + '" oninput="npItem(' + mi + ',' + ii + ',\'alternatif\',this.value)"></div>').join('') +
      '<button class="btn sec sm" style="margin-top:8px" onclick="npItemAdd(' + mi + ')">＋ Besin</button>' +
      '<textarea style="margin-top:8px;min-height:60px" placeholder="Açıklama: nasıl hazırlanacak, ne yapılacak (ör. yumurtaları haşla, yulafı sütle pişir, antrenmandan 1 saat önce ye)" oninput="npSet(' + mi + ',\'aciklama\',this.value)">' + esc(m.aciklama) + '</textarea></div>';
  });
  h += '<div class="row" style="margin-bottom:12px"><button class="btn sec sp" onclick="npAdd()">＋ Öğün ekle</button><button class="btn gh" onclick="S.npCopy=!S.npCopy;render_np()">⧉ Günü kopyala</button></div>';
  if(S.npCopy) h += '<div class="card"><b>' + GUN[g - 1] + ' gününü şu günlere kopyala:</b><div class="mut" style="margin:4px 0 8px">Seçtiğin günlerin mevcut planı bununla değişir.</div><div class="chips" id="cpdays">' + GUN.map((d, i) => i + 1 === g ? '' : '<label style="display:flex;gap:4px;align-items:center;font-size:13px;color:var(--ink);margin:0 8px 6px 0"><input type="checkbox" value="' + (i + 1) + '" style="width:auto">' + d + '</label>').join('') + '</div><button class="btn sm" style="margin-top:6px" onclick="npCopyDo()">Kopyala</button></div>';
  h += '<div class="card"><b>Başka öğrencinin planını kopyala</b><div class="row" style="margin-top:8px"><select id="npFrom" class="sp" style="width:auto">' + S.ov.students.filter(s => s.id !== S.sid).map(s => '<option value="' + s.id + '">' + esc(s.ad) + '</option>').join('') + '</select><button class="btn gh sm" onclick="npFromStu()">Kopyala</button></div><div class="mut" style="margin-top:6px">Tüm haftayı getirir; kaydetmeden önce düzenleyebilirsin.</div></div>';
  h += '<div style="position:sticky;bottom:72px;z-index:4;margin-bottom:12px"><button id="npSave" class="btn blk" style="box-shadow:0 6px 18px rgba(232,138,166,.45)" onclick="npSave()">' + (S.npDirty ? '💾 Beslenme planını kaydet (değişiklik var)' : '💾 Beslenme planını kaydet') + '</button></div>';
  h += '<datalist id="favlist">' + (S.cfavs || []).map(f => '<option value="' + esc(f.besin) + '">' + esc(f.porsiyon) + ' · ' + fx(f.kcal) + ' kcal</option>').join('') + '</datalist>';
  $('app').innerHTML = h;
}
function npSet(mi, f, v, re){ S.npEdit[mi][f] = v; npDirty(); if(re) render_np(); }
function npItem(mi, ii, f, v){ S.npEdit[mi].items[ii][f] = v; npDirty(); }
function npFav(mi, ii, v){
  const f = (S.cfavs || []).find(x => x.besin.toLocaleLowerCase('tr') === String(v).trim().toLocaleLowerCase('tr')); if(!f) return;
  const it = S.npEdit[mi].items[ii];
  if(n(it.kcal) || n(it.p)) return;
  Object.assign(it, {besin: f.besin, miktar: it.miktar || f.porsiyon, kcal: f.kcal, p: f.p, k: f.k, y: f.y}); npDirty(); render_np();
  toast('Değerler "sık yenenler"den geldi: 1 porsiyon = ' + f.porsiyon);
}
function npItemAdd(mi){ S.npEdit[mi].items.push({besin: '', miktar: '', kcal: '', p: '', k: '', y: '', alternatif: '', not: ''}); npDirty(); render_np(); }
function npItemDel(mi, ii){ S.npEdit[mi].items.splice(ii, 1); npDirty(); render_np(); }
function npAdd(){
  const used = S.npEdit.filter(m => m.gun === S.npDay).map(m => m.ogun), next = OGUNLER.find(o => used.indexOf(o) < 0) || 'Ara öğün 1';
  S.npEdit.push({gun: S.npDay, ogun: next, saat: '', aciklama: '', items: [{besin: '', miktar: '', kcal: '', p: '', k: '', y: '', alternatif: '', not: ''}]});
  npDirty(); render_np(); window.scrollTo(0, document.body.scrollHeight);
}
function npDel(mi){ S.npEdit.splice(mi, 1); npDirty(); render_np(); }
function npMove(mi, d){
  const g = S.npEdit[mi].gun, idx = S.npEdit.map((m, j) => m.gun === g ? j : -1).filter(j => j >= 0), pos = idx.indexOf(mi), to = idx[pos + d];
  if(to === undefined) return; const t = S.npEdit[mi]; S.npEdit[mi] = S.npEdit[to]; S.npEdit[to] = t; npDirty(); render_np();
}
function npClone(m, g){ return {gun: g, ogun: m.ogun, saat: m.saat, aciklama: m.aciklama, items: m.items.map(i => ({besin: i.besin, miktar: i.miktar, kcal: i.kcal, p: i.p, k: i.k, y: i.y, alternatif: i.alternatif, not: i.not || ''}))}; }
function npCopyDo(){
  const days = [...document.querySelectorAll('#cpdays input:checked')].map(x => Number(x.value)); if(!days.length){ toast('Kopyalanacak günleri seç', true); return; }
  const src = S.npEdit.filter(m => m.gun === S.npDay);
  S.npEdit = S.npEdit.filter(m => days.indexOf(m.gun) < 0);
  days.forEach(d => src.forEach(m => S.npEdit.push(npClone(m, d))));
  S.npCopy = false; npDirty(); render_np(); toast('✓ ' + GUN[S.npDay - 1] + ' → ' + days.map(d => GK[d - 1]).join(', ') + ' kopyalandı (kaydetmeyi unutma)');
}
function npFromStu(){
  const sid = val('npFrom'); if(!sid) return;
  call('nutrition', {sid}).then(r => {
    if(!r.meals.length){ toast('O öğrencinin planı boş', true); return; }
    S.npEdit = r.meals.map(m => npClone(m, m.gun)); npDirty(); render_np(); toast('✓ Plan kopyalandı, düzenleyip kaydet');
  }).catch(() => {});
}
function npSave(){
  const meals = S.npEdit.map(m => ({id: m.id || '', gun: m.gun, ogun: m.ogun, saat: m.saat, aciklama: m.aciklama,
    items: m.items.filter(i => String(i.besin || '').trim()).map(i => ({id: i.id || '', besin: i.besin, miktar: i.miktar, kcal: n(i.kcal), p: n(i.p), k: n(i.k), y: n(i.y), alternatif: i.alternatif, not: i.not || ''}))}));
  const sid = S.sid;
  call('saveNutrition', {sid, meals}).then(r => {
    if(sid !== S.sid) return;
    S.np = r; S.np.sid = sid; S.npEdit = JSON.parse(JSON.stringify(r.meals)); S.npDirty = false;
    toast('✓ Beslenme planı kaydedildi' + nTxt(r)); render_np(); call('overview', {}, true).then(o => S.ov = o).catch(() => {});
  }).catch(() => {});
}
function render_ayar(){
  const st = S.set;
  $('app').innerHTML = '<div class="card"><h3>➕ Yeni öğrenci</h3><div class="row"><input id="ns" class="sp" style="width:auto" placeholder="Ad Soyad"><button class="btn" onclick="addStu()">Ekle</button></div><div id="nsres"></div></div>' +
    '<div class="card"><h3>Öğrenciler</h3>' + S.ov.students.map(s => '<div class="warnli" onclick="S.dt=\'hedef\';openStu(\'' + s.id + '\')"><div class="row"><b class="sp">' + esc(s.ad) + '</b>' + (s.aktif ? '<span class="pill ok">aktif</span>' : '<span class="pill bad">pasif</span>') + '</div><div class="mut">' + (s.targets.kcal ? s.targets.kcal + ' kcal · P ' + s.targets.p + ' · K ' + s.targets.k + ' · Y ' + s.targets.y : 'Hedef girilmedi') + ' · link ve hedefler için dokun</div></div>').join('') + '</div>' +
    '<div class="card"><h3>⚠️ Uyarı eşikleri</h3><div class="grid g2">' +
    [['esik_giris_gun','Kaç gün giriş yoksa uyar'],['esik_olcum_gun','Kaç gün ölçüm yoksa uyar'],['esik_kalori_ust','Kalori üst sınır (% hedef)'],['esik_kalori_alt','Kalori alt sınır (% hedef)'],['esik_protein_alt','Protein alt sınır (% hedef)'],['esik_su_alt','Su alt sınır (% hedef)']]
      .map(x => '<div class="f"><label>' + x[1] + '</label><input id="e_' + x[0] + '" inputmode="numeric" value="' + st[x[0]] + '"></div>').join('') +
    '</div><button class="btn sec blk" onclick="saveSet()">Eşikleri kaydet</button><div class="mut" style="margin-top:8px">Uyarılar bugünün değerlerine göre hesaplanır. "Fazla" uyarısı hedef aşılınca hemen, "düşük" uyarıları gün bitmeden yanıltmasın diye akşam 18:00\'den sonra çıkar.</div></div>';
}
function addStu(){
  const ad = val('ns').trim(); if(!ad){ toast('İsim yaz', true); return; }
  call('addStudent', {ad}).then(r => {
    $('ns').value = '';
    $('nsres').innerHTML = '<div style="margin-top:10px"><div class="mut">✓ ' + esc(r.ad) + ' eklendi. Linki:</div><div class="link" id="nlink">' + esc(r.link) + '</div><div class="row" style="margin-top:6px"><button class="btn sec sm" onclick="cp(\'nlink\')">Kopyala</button><a class="btn gh sm" style="text-decoration:none" target="_blank" href="https://wa.me/?text=' + encodeURIComponent('Merhaba! Beslenme ve antrenman takip sayfan: ' + r.link) + '">WhatsApp</a></div><div class="mut" style="margin-top:6px">Hedeflerini Öğrenci → Hedefler & link kısmından girebilirsin.</div></div>';
    call('overview').then(o => { S.ov = o; });
  });
}
function saveSet(){
  const p = {}; ['esik_giris_gun','esik_olcum_gun','esik_kalori_ust','esik_kalori_alt','esik_protein_alt','esik_su_alt'].forEach(k => p[k] = val('e_' + k));
  call('saveSettings', p).then(r => { S.set = r; toast('✓ Kaydedildi'); call('overview').then(o => S.ov = o); });
}

/* ---------- başlat ---------- */
function locked(msg){
  $('nav').style.display = 'none';
  $('app').innerHTML = '<div class="card empty" style="margin-top:40px"><div style="font-size:40px">🔒</div><b>' + esc(msg) + '</b><br>Linkini antrenöründen iste.</div>';
}
const CK = 'dh_c_' + TOKEN;
function cacheGet(){ try { return JSON.parse(localStorage.getItem(CK) || 'null'); } catch(e) { return null; } }
function cacheSet(r){ try { localStorage.setItem(CK, JSON.stringify(r)); } catch(e) {} }
let booted = false;
function boot(r){
  if(!booted){ booted = true; ROLE = r.role; if(ROLE === 'coach') cInit(r); else stInit(r); return; }
  if(r.role !== ROLE) return;
  if(ROLE === 'coach'){ S.ov = r; S.ovTs = Date.now(); rerender(); return; }
  S.favs = pend ? S.favs : r.favs;
  if(pend || r.day.date !== S.date) return;
  stBoot(r); rerender();
}
function prefetch(){
  call('meas', {}, true).then(m => { if(!S.meas) S.meas = m; }).catch(() => {});
  call('program', {week: todayS()}, true).then(p => { if(!S.prog) S.prog = p; }).catch(() => {});
  call('plan', {}, true).then(p => { S.plan = p; if(S.tab === 'bugun' && idle()) render_bugun(); else if(S.tab === 'plan' && idle()) render_plan(); }).catch(() => {});
}
window.addEventListener('unhandledrejection', ev => ev.preventDefault());
if(!TOKEN) locked('Bu sayfaya erişim için kişisel linkin gerekiyor.');
else {
  const c = cacheGet();
  if(c && c.role && (c.role === 'coach' ? c.students : (c.day && c.day.date === todayS()))) boot(c);
  call('init', {date: todayS()}, true).then(r => {
    cacheSet(r); boot(r);
    if(ROLE === 'student') prefetch();
  }).catch(e => {
    if(e && e.message && /Geçersiz/.test(e.message)){ try { localStorage.removeItem(CK); } catch(_) {} locked('Bu link geçersiz ya da artık aktif değil.'); }
    else if(!booted) $('app').innerHTML = '<div class="card empty" style="margin-top:40px">Bağlanılamadı. İnternetini kontrol et.<br><br><button class="btn" onclick="location.reload()">Tekrar dene</button></div>';
    else toast('Bağlantı yok, son kayıtlı bilgiler gösteriliyor.', true);
  });
}
</script>
